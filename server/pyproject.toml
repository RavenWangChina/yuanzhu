[project]
name = "yuanzhu"
version = "0.1.2"
description = "元铸工坊 SOSOFAST——把最佳实践铸成可治理的 AI 工作流资产（AI 提议，人拍板）"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "MiaoYu" }]
keywords = ["ai-workflow", "agent", "ontology", "mcp", "staged-writes", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.1",
    "litellm>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/RavenWangChina/yuanzhu"
Documentation = "https://github.com/RavenWangChina/yuanzhu/tree/main/docs"
Issues = "https://github.com/RavenWangChina/yuanzhu/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[project.scripts]
yuanzhu = "yuanzhu.cli:main"
yuanzhu-server = "yuanzhu.server_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuanzhu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
